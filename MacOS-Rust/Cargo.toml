[package]
name = "psx-launcher-macos-rust"
version = "2.0.0-alpha.1"
edition = "2024"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
fs2 = "0.4"
libc = "0.2"
plist = "1.7"
winit = "0.30.9"
tray-icon = { version = "=0.19.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
