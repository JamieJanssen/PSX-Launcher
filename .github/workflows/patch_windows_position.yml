name: Patch Windows launcher position persistence

on:
  push:
    paths:
      - '.github/workflows/patch_windows_position.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Windows launcher
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Windows/psx_app_launcher.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace('Version 1.1', 'Version 1.2', 1)
          text = text.replace('APP_VERSION = "1.1"', 'APP_VERSION = "1.2"', 1)
          text = text.replace('import os\nimport subprocess', 'import os\nimport re\nimport subprocess', 1)

          marker = '\n\ndef configured_items(config: configparser.ConfigParser) -> list[LauncherItem]:\n'
          function = r'''

def save_launcher_position(x: int, y: int) -> None:
    """Update only x and y in [Launcher], preserving the existing INI."""
    try:
        with CONFIG_PATH.open("r+", encoding="utf-8-sig", newline="") as handle:
            text = handle.read()
            newline = "\r\n" if "\r\n" in text else "\n"
            lines = text.splitlines(keepends=True)

            section_pattern = re.compile(
                r"^\s*\[([^]]+)\]\s*(?:[;#].*)?(?:\r?\n)?$",
                re.IGNORECASE,
            )
            value_pattern = re.compile(
                r"^(\s*)(x|y)(\s*=\s*).*(\r?\n)?$",
                re.IGNORECASE,
            )

            launcher_start = None
            launcher_end = len(lines)
            for index, line in enumerate(lines):
                match = section_pattern.match(line)
                if not match:
                    continue
                if match.group(1).strip().lower() == "launcher":
                    launcher_start = index
                    for later in range(index + 1, len(lines)):
                        if section_pattern.match(lines[later]):
                            launcher_end = later
                            break
                    break

            if launcher_start is None:
                prefix = "" if not text or text.endswith(("\n", "\r")) else newline
                lines.extend([
                    prefix + "[Launcher]" + newline,
                    f"x = {x}{newline}",
                    f"y = {y}{newline}",
                ])
            else:
                found = {"x": False, "y": False}
                for index in range(launcher_start + 1, launcher_end):
                    match = value_pattern.match(lines[index])
                    if not match:
                        continue
                    key = match.group(2).lower()
                    ending = match.group(4) or newline
                    value = x if key == "x" else y
                    lines[index] = (
                        f"{match.group(1)}{match.group(2)}"
                        f"{match.group(3)}{value}{ending}"
                    )
                    found[key] = True

                additions = []
                if not found["x"]:
                    additions.append(f"x = {x}{newline}")
                if not found["y"]:
                    additions.append(f"y = {y}{newline}")
                if additions:
                    lines[launcher_end:launcher_end] = additions

            handle.seek(0)
            handle.write("".join(lines))
            handle.truncate()
            handle.flush()
            os.fsync(handle.fileno())
    except (OSError, UnicodeError):
        pass
'''
          if 'def save_launcher_position(' not in text:
              if marker not in text:
                  raise SystemExit('configured_items marker not found')
              text = text.replace(marker, function + marker, 1)

          old_close = '''    def close(self) -> None:\n        try:\n            self.destroy()\n        except tk.TclError:\n            pass\n'''
          new_close = '''    def close(self) -> None:\n        if not self.winfo_exists():\n            return\n        try:\n            self.update_idletasks()\n            save_launcher_position(self.winfo_x(), self.winfo_y())\n        except tk.TclError:\n            pass\n        try:\n            self.destroy()\n        except tk.TclError:\n            pass\n'''
          if old_close not in text:
              raise SystemExit('close block not found')
          text = text.replace(old_close, new_close, 1)

          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/patch_windows_position.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Save Windows launcher position without replacing INI"
          git push origin main
