name: Patch Windows launcher position persistence

on:
  push:
    paths:
      - .github/workflows/patch_windows_position.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch and commit
        env:
          OLD_CLOSE_B64: ICAgIGRlZiBjbG9zZShzZWxmKSAtPiBOb25lOgogICAgICAgIHRyeToKICAgICAgICAgICAgc2VsZi5kZXN0cm95KCkKICAgICAgICBleGNlcHQgdGsuVGNsRXJyb3I6CiAgICAgICAgICAgIHBhc3MK
          NEW_CLOSE_B64: 
          FUNC_B64: 
        run: |
          python -c 'import os,base64,pathlib; p=pathlib.Path("Windows/psx_app_launcher.py"); t=p.read_text(encoding="utf-8"); t=t.replace("Version 1.1","Version 1.2",1).replace("APP_VERSION = \"1.1\"","APP_VERSION = \"1.2\"",1).replace("import os\nimport subprocess","import os\nimport re\nimport subprocess",1); marker="\n\ndef configured_items(config: configparser.ConfigParser) -> list[LauncherItem]:\n"; f=base64.b64decode(os.environ["FUNC_B64"]).decode(); t=t if "def save_launcher_position(" in t else t.replace(marker,f+marker,1); o=base64.b64decode(os.environ["OLD_CLOSE_B64"]).decode(); n=base64.b64decode(os.environ["NEW_CLOSE_B64"]).decode(); assert o in t; p.write_text(t.replace(o,n,1),encoding="utf-8")'
          rm .github/workflows/patch_windows_position.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Save Windows launcher position without replacing INI"
          git push origin main
