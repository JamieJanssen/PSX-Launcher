name: Fix macOS INI metadata preservation

on:
  push:
    paths:
      - .github/workflows/fix_ini_metadata.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch and commit
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          python -c 'import os,base64,pathlib; p=pathlib.Path("MacOS/psx_app_launcher.py"); t=p.read_text(); o=base64.b64decode(os.environ["OLD_B64"]).decode(); n=base64.b64decode(os.environ["NEW_B64"]).decode(); assert o in t; p.write_text(t.replace(o,n,1))'
          rm .github/workflows/fix_ini_metadata.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Preserve macOS INI file metadata when saving position"
          git push origin main
